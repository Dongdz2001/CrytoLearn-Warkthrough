<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="#0f172a" stroke="#6c5ce7" stroke-width="2" />

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#titleGrad)" style="filter:url(#glow)">BIỂU ĐỒ KIẾN TRÚC DỮ LIỆU &amp; MODULE</text>

  <!-- Data Layer -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="280" height="400" rx="15" fill="url(#folderGrad)" stroke="#6c5ce7" stroke-width="2" />
    <text x="140" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#a29bfe">src/data/</text>
    <line x1="20" y1="45" x2="260" y2="45" stroke="#6c5ce7" stroke-width="1" />
    
    <!-- Files in data/ -->
    <g transform="translate(20, 70)">
       <path d="M0,0 L180,0 L200,20 L200,60 L0,60 Z" fill="#1e293b" stroke="#00d2ff" stroke-width="1.5" />
       <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0">ciphers.js</text>
       <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">(Danh sách &amp; Phân loại)</text>
    </g>
    <g transform="translate(20, 150)">
       <path d="M0,0 L180,0 L200,20 L200,60 L0,60 Z" fill="#1e293b" stroke="#00d2ff" stroke-width="1.5" />
       <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0">theories.js</text>
       <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">(Nội dung lý thuyết)</text>
    </g>
    <g transform="translate(20, 230)">
       <path d="M0,0 L180,0 L200,20 L200,60 L0,60 Z" fill="#1e293b" stroke="#00d2ff" stroke-width="1.5" />
       <text x="100" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e2e8f0">quiz.js</text>
       <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">(Câu hỏi trắc nghiệm)</text>
    </g>
  </g>

  <!-- Algorithm Modules Layer -->
  <g transform="translate(420, 120)">
    <rect x="0" y="0" width="280" height="400" rx="15" fill="url(#folderGrad)" stroke="#00d2ff" stroke-width="2" />
    <text x="140" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00d2ff">src/ciphers/</text>
    <line x1="20" y1="45" x2="260" y2="45" stroke="#00d2ff" stroke-width="1" />

    <!-- File Modules in ciphers/ -->
    <g transform="translate(25, 70)">
       <rect x="0" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#a29bfe" stroke-width="1" />
       <text x="52.5" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">caesar.js</text>
    </g>
    <g transform="translate(150, 70)">
       <rect x="0" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#a29bfe" stroke-width="1" />
       <text x="52.5" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">aes.js</text>
    </g>
    <g transform="translate(25, 140)">
       <rect x="0" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#a29bfe" stroke-width="1" />
       <text x="52.5" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">rsa.js</text>
    </g>
    <g transform="translate(150, 140)">
       <rect x="0" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#a29bfe" stroke-width="1" />
       <text x="52.5" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">hash.js</text>
    </g>
    <g transform="translate(25, 210)">
       <rect x="0" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#a29bfe" stroke-width="1" />
       <text x="52.5" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">des.js</text>
    </g>
    <g transform="translate(150, 210)">
       <rect x="0" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#a29bfe" stroke-width="1" />
       <text x="52.5" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">vigenere.js</text>
    </g>
    <g transform="translate(25, 280)">
       <rect x="0" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#a29bfe" stroke-width="1" />
       <text x="52.5" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">atbash.js</text>
    </g>
    <g transform="translate(150, 280)">
       <rect x="0" y="0" width="105" height="45" rx="8" fill="#1e293b" stroke="#a29bfe" stroke-width="1" />
       <text x="52.5" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">xor.js</text>
    </g>

    <text x="140" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b" font-style="italic">... các module thuật toán riêng biệt</text>
  </g>

  <!-- Connection Link -->
  <g transform="translate(380, 300)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#a29bfe" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#a29bfe" />
  </marker>

  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b" font-style="italic">Mô hình tổ chức Modules &amp; Data - Gemini Banana Style</text>
</svg>
