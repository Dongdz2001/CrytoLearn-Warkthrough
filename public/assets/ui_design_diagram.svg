<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="#0f172a" stroke="#6c5ce7" stroke-width="2" />

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#titleGrad)" style="filter:url(#glow)">SƠ ĐỒ CẤU TRÚC GIAO DIỆN (UI/UX)</text>

  <!-- Home Page Card -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="220" height="150" rx="15" fill="url(#uiGrad)" stroke="#a29bfe" stroke-width="2" />
    <text x="110" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#a29bfe">Trang chủ (Home)</text>
    <line x1="20" y1="45" x2="200" y2="45" stroke="#64748b" stroke-width="1" />
    <text x="20" y="75" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">• Danh sách thuật toán</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">• Phân loại theo nhóm</text>
    <text x="20" y="125" font-family="Arial, sans-serif" font-size="14" fill="#64748b" font-style="italic">(Modern Dark Mode UI)</text>
  </g>

  <!-- Detail Page Card -->
  <g transform="translate(350, 120)">
    <rect x="0" y="0" width="400" height="250" rx="15" fill="url(#uiGrad)" stroke="#00d2ff" stroke-width="2" />
    <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#00d2ff">Trang chi tiết (Cipher Page)</text>
    <line x1="20" y1="45" x2="380" y2="45" stroke="#64748b" stroke-width="1" />
    
    <!-- Tabs Simulation -->
    <rect x="20" y="60" width="170" height="30" rx="5" fill="#6c5ce7" />
    <text x="105" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">Tab: Lý thuyết</text>
    
    <rect x="210" y="60" width="170" height="30" rx="5" fill="#1e293b" stroke="#00d2ff" stroke-width="1" />
    <text x="295" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#00d2ff">Tab: Thực hành</text>

    <!-- Sub-features -->
    <text x="30" y="125" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">• Nội dung học thuật / Lịch sử</text>
    <text x="30" y="155" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">• Demo Tool tương tác (Interactive)</text>
    <text x="30" y="185" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">• Bảng tra cứu (Lookup Tables)</text>
    <text x="30" y="215" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">• Hiệu ứng Hover &amp; Animation</text>
  </g>

  <!-- Interactive System Card -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="700" height="120" rx="15" fill="url(#uiGrad)" stroke="#6c5ce7" stroke-width="2" stroke-dasharray="8" />
    <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6c5ce7">Hệ thống tương tác (Interactivity &amp; Feedback)</text>
    <line x1="100" y1="45" x2="600" y2="45" stroke="#64748b" stroke-width="1" />
    
    <g transform="translate(50, 70)">
       <circle cx="0" cy="0" r="5" fill="#00d2ff" />
       <text x="15" y="5" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">Bài tập (Quizzes)</text>
    </g>
    <g transform="translate(250, 70)">
       <circle cx="0" cy="0" r="5" fill="#00d2ff" />
       <text x="15" y="5" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">Giải thích chi tiết (Feedback)</text>
    </g>
    <g transform="translate(500, 70)">
       <circle cx="0" cy="0" r="5" fill="#00d2ff" />
       <text x="15" y="5" font-family="Arial, sans-serif" font-size="14" fill="#e2e8f0">Game History Tracking</text>
    </g>
  </g>

  <!-- Connection Arrows -->
  <path d="M 270,195 L 340,195" fill="none" stroke="#a29bfe" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4" />
  <path d="M 400,370 L 400,410" fill="none" stroke="#00d2ff" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="4" />

  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d2ff" />
  </marker>

  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b" font-style="italic">UI/UX Layout Architecture - Gemini Banana Style</text>
</svg>
