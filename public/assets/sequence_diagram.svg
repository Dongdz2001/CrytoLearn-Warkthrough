<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="#0f172a" stroke="#6c5ce7" stroke-width="2" />

  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#titleGrad)" style="filter:url(#glow)">BIỂU ĐỒ SEQUENCE: QUY TRÌNH MÃ HÓA</text>

  <!-- Lifelines -->
  <g transform="translate(150, 120)">
    <rect x="-60" y="0" width="120" height="40" rx="10" fill="#1e293b" stroke="#a29bfe" stroke-width="2" />
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#a29bfe">Người dùng</text>
    <line x1="0" y1="40" x2="0" y2="450" stroke="#a29bfe" stroke-width="2" stroke-dasharray="8" />
  </g>

  <g transform="translate(400, 120)">
    <rect x="-60" y="0" width="120" height="40" rx="10" fill="#1e293b" stroke="#00d2ff" stroke-width="2" />
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#00d2ff">Giao diện</text>
    <line x1="0" y1="40" x2="0" y2="450" stroke="#00d2ff" stroke-width="2" stroke-dasharray="8" />
  </g>

  <g transform="translate(650, 120)">
    <rect x="-60" y="0" width="120" height="40" rx="10" fill="#1e293b" stroke="#6c5ce7" stroke-width="2" />
    <text x="0" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#6c5ce7">Module Xử lý</text>
    <line x1="0" y1="40" x2="0" y2="450" stroke="#6c5ce7" stroke-width="2" stroke-dasharray="8" />
  </g>

  <!-- Activation Bars Layer -->
  <!-- UI Activation -->
  <rect x="390" y="200" width="20" height="260" fill="#1e293b" stroke="#00d2ff" stroke-width="1" />
  <!-- Module Activation -->
  <rect x="640" y="230" width="20" height="150" fill="#1e293b" stroke="#6c5ce7" stroke-width="1" />

  <!-- Messages -->
  <!-- 1. Nhập dữ liệu & khóa -->
  <line x1="150" y1="200" x2="390" y2="200" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow)" />
  <text x="270" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0">1. Nhập dữ liệu &amp; Khóa</text>

  <!-- 2. Gửi dữ liệu tới module -->
  <line x1="410" y1="230" x2="640" y2="230" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow)" />
  <text x="525" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0">2. Gửi dữ liệu</text>

  <!-- 3. Thực hiện mã hóa (Self-loop) -->
  <path d="M 660,260 C 700,260 700,300 660,300" fill="none" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow)" />
  <text x="740" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0">3. Thực hiện mã hóa</text>

  <!-- 4. Trả về kết quả -->
  <line x1="640" y1="380" x2="410" y2="380" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
  <text x="525" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0">4. Trả về kết quả</text>

  <!-- 5. Hiển thị & Cho phép sao chép -->
  <line x1="390" y1="420" x2="150" y2="420" stroke="#e2e8f0" stroke-width="2" marker-end="url(#arrow)" />
  <text x="270" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0">5. Hiển thị &amp; Sao chép</text>

  <!-- Arrows Marker -->
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2e8f0" />
  </marker>

  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b" font-style="italic">Generated by Gemini Banana Style - CrytoLearn App</text>
</svg>
