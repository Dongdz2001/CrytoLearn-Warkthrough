<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" rx="20" fill="#0f172a" stroke="#6c5ce7" stroke-width="2" />
  
  <!-- Title -->
  <text x="400" y="60" text-anchor="middle" font-family="'Outfit', 'Inter', Arial, sans-serif" font-size="32" font-weight="bold" fill="url(#titleGrad)" style="filter:url(#glow)">BIỂU ĐỒ USE CASE: THỰC HÀNH MÃ HÓA</text>
  
  <!-- Actor: User (Người dùng) -->
  <g transform="translate(100, 250)">
    <!-- Stick figure head -->
    <circle cx="0" cy="-40" r="15" fill="none" stroke="#a29bfe" stroke-width="3" />
    <!-- Body -->
    <line x1="0" y1="-25" x2="0" y2="20" stroke="#a29bfe" stroke-width="3" />
    <!-- Arms -->
    <line x1="-25" y1="-10" x2="25" y2="-10" stroke="#a29bfe" stroke-width="3" />
    <!-- Legs -->
    <line x1="0" y1="20" x2="-20" y2="50" stroke="#a29bfe" stroke-width="3" />
    <line x1="0" y1="20" x2="20" y2="50" stroke="#a29bfe" stroke-width="3" />
    <!-- Label -->
    <text x="0" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#a29bfe">Người dùng</text>
  </g>
  
  <!-- System Boundary -->
  <rect x="250" y="100" width="450" height="420" rx="15" fill="url(#boxGrad)" stroke="#6c5ce7" stroke-width="2" opacity="0.6" />
  <text x="475" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00d2ff">Ứng dụng Crypto Learn</text>
  
  <!-- Use Case: Nhập dữ liệu & Khóa -->
  <g transform="translate(475, 180)">
    <ellipse cx="0" cy="0" rx="160" ry="35" fill="#1e293b" stroke="#6c5ce7" stroke-width="2" />
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e2e8f0">Nhập dữ liệu &amp; Khóa</text>
  </g>
  
  <!-- Use Case: Thực hiện mã hóa -->
  <g transform="translate(475, 270)">
    <ellipse cx="0" cy="0" rx="160" ry="35" fill="#1e293b" stroke="#6c5ce7" stroke-width="2" />
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e2e8f0">Thực hiện mã hóa</text>
  </g>
  
  <!-- Use Case: Xem kết quả -->
  <g transform="translate(475, 360)">
    <ellipse cx="0" cy="0" rx="160" ry="35" fill="#1e293b" stroke="#6c5ce7" stroke-width="2" />
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e2e8f0">Xem kết quả hiển thị</text>
  </g>
  
  <!-- Use Case: Sao chép kết quả -->
  <g transform="translate(475, 450)">
    <ellipse cx="0" cy="0" rx="160" ry="35" fill="#1e293b" stroke="#6c5ce7" stroke-width="2" />
    <text x="0" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#e2e8f0">Sao chép kết quả</text>
  </g>
  
  <!-- Associations -->
  <line x1="125" y1="210" x2="315" y2="180" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4" />
  <line x1="125" y1="230" x2="315" y2="270" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4" />
  <line x1="125" y1="250" x2="315" y2="360" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4" />
  <line x1="125" y1="270" x2="315" y2="450" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4" />

  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b" font-style="italic">Generated by Gemini Banana Style - CrytoLearn App</text>
</svg>
